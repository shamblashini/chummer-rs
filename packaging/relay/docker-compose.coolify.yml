# chummer-relay on Coolify (https://coolify.io).
#
# Coolify's proxy (Traefik) does HTTPS for the relay's domain, with the
# certificate Coolify gets from Let's Encrypt, and forwards plain HTTP to
# the relay's port 80, websockets included. The relay runs in
# cert_mode "proxy": no certificate of its own, nothing published on the
# server. This also works with the domain behind Cloudflare's proxy.
#
# In Coolify: New resource → Docker Compose Empty, paste this file, then
# set the chummer-relay service's Domain to https://<your relay domain>
# and deploy. The logs show the mailbox node id. Nothing else is needed;
# every variable below is optional.
# Full steps: docs/relay.md, "Deploy on Coolify".
services:
  chummer-relay:
    # `latest` is the newest release; `edge` follows master (for app builds
    # from master); a version (0.5.0) stays put until you change it.
    image: ghcr.io/shamblashini/chummer-relay:${RELAY_TAG:-latest}
    restart: unless-stopped
    environment:
      RELAY_CERT_MODE: proxy
      # Optional: the relay's domain, only so the log prints the complete
      # relay entry (https://<domain>#<mailbox node id>).
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:-}
      RUST_LOG: info,iroh=warn
    # Coolify routes the domain here (the image's relay.toml listens on 80).
    expose:
      - "80"
    volumes:
      # The mailbox database and the mailbox node key (its id is what
      # players' apps use to find the mailbox). Back it up.
      - chummer-relay-data:/var/lib/chummer-relay
volumes:
  chummer-relay-data:
