[package]
name = "chummer-gui"
description = "Desktop UI for chummer-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chummer-rs"
path = "src/main.rs"

[dependencies]
chummer-core.workspace = true
anyhow.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = "0.33"
egui-phosphor = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chummer-sync.workspace = true
chummer-net.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# Windows: the app icon and version info in chummer-rs.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }
