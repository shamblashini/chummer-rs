[package]
name = "chummer-testpeer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "chummer-rs test peer: a headless player (and helpers) for the relay/mailbox end-to-end tests in tests/e2e"
publish = false

[[bin]]
name = "chummer-testpeer"
path = "src/main.rs"

[dependencies]
chummer-core.workspace = true
chummer-net.workspace = true
chummer-sync.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
