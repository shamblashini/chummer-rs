[workspace]
resolver = "2"
members = ["crates/chummer-core", "crates/chummer-gui", "crates/chummer-cli", "crates/chummer-net", "crates/chummer-relay"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/shamblashini/chummer-rs"

[workspace.dependencies]
chummer-core = { path = "crates/chummer-core" }
quick-xml = "0.42"
thiserror = "2"
anyhow = "1"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "encoder"] }
# Online campaigns (chummer-net, chummer-relay)
chummer-net = { path = "crates/chummer-net" }
iroh = "1.3"
iroh-relay = "1.3"
tokio = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
dirs = "6"
url = "2.5"
n0-future = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redb = "4.3"
clap = { version = "4", features = ["derive"] }
toml = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
