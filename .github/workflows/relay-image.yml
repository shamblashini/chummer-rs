name: Relay image
# Builds the chummer-relay Docker image (amd64 + arm64) and pushes it to
# ghcr.io/<owner>/chummer-relay without making a release:
# - on pushes to master that touch the relay or what it is built from, as
#   :edge and :sha-<commit>;
# - by hand (Actions → Relay image → Run workflow), with a tag you choose
#   (default "edge").
# Release tags (v*) still publish :<version> and :latest from release.yml.
on:
  push:
    branches: [master]
    paths:
      - "crates/chummer-relay/**"
      - "crates/chummer-net/**"
      - "packaging/relay/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/relay-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (in addition to sha-<commit>)"
        required: false
        default: "edge"

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chummer-relay
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'edge' }}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### chummer-relay image pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "On the server: set the image in docker-compose.yml to one of these tags, then"
            echo '`docker compose pull && docker compose up -d`.'
          } >> "$GITHUB_STEP_SUMMARY"
