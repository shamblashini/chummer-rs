name: Release
# Push a tag like v0.2.0 to build Linux and Windows packages and publish
# them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p chummer-gui -p chummer-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="chummer-rs-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/chummer-rs${{ matrix.ext }}" "$dir/"
          cp "target/${{ matrix.target }}/release/chummer-cli${{ matrix.ext }}" "$dir/"
          mkdir -p "$dir/resources"
          cp -r resources/data resources/lang resources/sheets resources/customdata resources/export resources/xml_license.txt "$dir/resources/"
          cp LICENSE README.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp packaging/chummer-rs.desktop packaging/chummer-rs.svg packaging/chummer-rs-mime.xml "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
