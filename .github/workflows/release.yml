name: Release
# Push a tag like v0.2.0 to build Linux, Windows and macOS packages and
# publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  # Manual runs build the packages (as artifacts) without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p chummer-gui -p chummer-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="chummer-rs-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/chummer-rs${{ matrix.ext }}" "$dir/"
          cp "target/${{ matrix.target }}/release/chummer-cli${{ matrix.ext }}" "$dir/"
          mkdir -p "$dir/resources"
          cp -r resources/data resources/lang resources/sheets resources/customdata resources/export resources/xml_license.txt "$dir/resources/"
          cp LICENSE README.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp packaging/chummer-rs.desktop packaging/chummer-rs.svg packaging/chummer-rs-mime.xml "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  macos:
    # One universal (Apple Silicon + Intel) binary in a .app bundle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p chummer-gui -p chummer-cli --target $t
          done
      - name: Package
        run: |
          set -e
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          dir="chummer-rs-${GITHUB_REF_NAME//\//-}-macos-universal"
          app="$dir/chummer-rs.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources/resources"
          for b in chummer-rs chummer-cli; do
            lipo -create -output "$app/MacOS/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          sed "s/@VERSION@/$ver/g" packaging/Info.plist > "$app/Info.plist"
          cp -r resources/data resources/lang resources/sheets resources/customdata resources/export resources/xml_license.txt "$app/Resources/resources/"
          # Icon from the SVG, if librsvg is available.
          if brew install librsvg >/dev/null 2>&1; then
            set=chummer-rs.iconset; mkdir -p $set
            for s in 16 32 128 256 512; do
              rsvg-convert -w $s -h $s packaging/chummer-rs.svg -o $set/icon_${s}x${s}.png
              rsvg-convert -w $((s*2)) -h $((s*2)) packaging/chummer-rs.svg -o $set/icon_${s}x${s}@2x.png
            done
            iconutil -c icns $set -o "$app/Resources/chummer-rs.icns"
          fi
          # Ad-hoc signature: required for Apple Silicon; not notarised.
          codesign --force --deep -s - "$dir/chummer-rs.app"
          cp LICENSE README.md "$dir/"
          ditto -c -k --keepParent "$dir" "$dir.zip"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ${{ env.ASSET }}

  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
